<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">乐萌知识库 RAG 架构图</title>
  <desc id="desc">用户请求经过 API、意图路由和四类 Agent 路径，调用混合检索和语言模型生成响应。底部展示从 Markdown 知识库构建向量库和 BM25 索引的离线流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .title { fill: #0F172A; font: 700 30px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .section { fill: #475569; font: 600 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; letter-spacing: 1px; }
      .node-title { fill: #0F172A; font: 700 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .node-sub { fill: #475569; font: 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .small { fill: #64748B; font: 12px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .line { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .panel { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
      .node { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .agent { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1.5; }
      .core { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 1.5; }
      .storage { fill: #F0FDF4; stroke: #86EFAC; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#FFFFFF"/>
  <text x="40" y="46" class="title">乐萌知识库 RAG：请求处理与索引构建</text>

  <rect x="25" y="74" width="1550" height="382" rx="14" class="panel"/>
  <text x="52" y="108" class="section">在线请求链路</text>

  <rect x="50" y="212" width="140" height="96" rx="10" class="node"/>
  <text x="120" y="250" text-anchor="middle" class="node-title">用户请求</text>
  <text x="120" y="276" text-anchor="middle" class="node-sub">question · mode</text>

  <rect x="245" y="212" width="165" height="96" rx="10" class="node"/>
  <text x="327" y="247" text-anchor="middle" class="node-title">FastAPI</text>
  <text x="327" y="273" text-anchor="middle" class="node-sub">/ask · /stream</text>

  <rect x="465" y="212" width="150" height="96" rx="10" class="node"/>
  <text x="540" y="247" text-anchor="middle" class="node-title">意图路由</text>
  <text x="540" y="273" text-anchor="middle" class="node-sub">关键词 + LLM</text>

  <rect x="675" y="123" width="210" height="52" rx="9" class="agent"/>
  <text x="700" y="146" class="node-title">FAQ</text>
  <text x="750" y="146" class="node-sub">单轮检索 · 缓存</text>

  <rect x="675" y="195" width="210" height="52" rx="9" class="agent"/>
  <text x="700" y="218" class="node-title">Talk</text>
  <text x="750" y="218" class="node-sub">多路检索 · 话术</text>

  <rect x="675" y="267" width="210" height="52" rx="9" class="agent"/>
  <text x="700" y="290" class="node-title">Script</text>
  <text x="760" y="290" class="node-sub">多路检索 · 分镜</text>

  <rect x="675" y="339" width="210" height="52" rx="9" class="agent"/>
  <text x="700" y="362" class="node-title">Complex</text>
  <text x="785" y="362" class="node-sub">工具循环 · 最多 4 轮</text>

  <rect x="955" y="192" width="210" height="136" rx="10" class="core"/>
  <text x="1060" y="229" text-anchor="middle" class="node-title">Hybrid Retriever</text>
  <text x="1060" y="257" text-anchor="middle" class="node-sub">向量检索 + BM25</text>
  <text x="1060" y="281" text-anchor="middle" class="node-sub">RRF 融合 · Rerank</text>
  <text x="1060" y="305" text-anchor="middle" class="node-sub">HyDE / 邻接扩展</text>

  <rect x="1230" y="212" width="145" height="96" rx="10" class="core"/>
  <text x="1302" y="248" text-anchor="middle" class="node-title">LLM</text>
  <text x="1302" y="274" text-anchor="middle" class="node-sub">检索增强生成</text>

  <rect x="1430" y="212" width="115" height="96" rx="10" class="node"/>
  <text x="1487" y="247" text-anchor="middle" class="node-title">响应</text>
  <text x="1487" y="273" text-anchor="middle" class="node-sub">答案 · 来源</text>

  <path d="M190 260 H245" class="line"/>
  <path d="M410 260 H465" class="line"/>
  <path d="M615 260 H645 V149 H675" class="line"/>
  <path d="M615 260 H675" class="line"/>
  <path d="M615 260 H645 V293 H675" class="line"/>
  <path d="M615 260 H645 V365 H675" class="line"/>
  <path d="M885 149 H920 V260 H955" class="line"/>
  <path d="M885 221 H955" class="line"/>
  <path d="M885 293 H920 V260 H955" class="line"/>
  <path d="M885 365 H920 V260 H955" class="line"/>
  <path d="M1165 260 H1230" class="line"/>
  <path d="M1375 260 H1430" class="line"/>

  <rect x="25" y="492" width="1550" height="228" rx="14" class="panel"/>
  <text x="52" y="526" class="section">离线知识库构建与启动加载</text>

  <rect x="90" y="577" width="190" height="92" rx="10" class="node"/>
  <text x="185" y="613" text-anchor="middle" class="node-title">Markdown 知识库</text>
  <text x="185" y="639" text-anchor="middle" class="node-sub">data/*.md</text>

  <rect x="360" y="577" width="200" height="92" rx="10" class="node"/>
  <text x="460" y="613" text-anchor="middle" class="node-title">标题感知切分</text>
  <text x="460" y="639" text-anchor="middle" class="node-sub">Markdown Splitter</text>

  <rect x="640" y="577" width="190" height="92" rx="10" class="node"/>
  <text x="735" y="613" text-anchor="middle" class="node-title">Embedding</text>
  <text x="735" y="639" text-anchor="middle" class="node-sub">文档向量化</text>

  <rect x="910" y="577" width="210" height="92" rx="10" class="storage"/>
  <text x="1015" y="613" text-anchor="middle" class="node-title">Chroma VectorStore</text>
  <text x="1015" y="639" text-anchor="middle" class="node-sub">文本 · 向量 · Metadata</text>

  <rect x="1200" y="577" width="190" height="92" rx="10" class="storage"/>
  <text x="1295" y="613" text-anchor="middle" class="node-title">BM25 Index</text>
  <text x="1295" y="639" text-anchor="middle" class="node-sub">领域词表 · 关键词</text>

  <path d="M280 623 H360" class="line"/>
  <path d="M560 623 H640" class="line"/>
  <path d="M830 623 H910" class="line"/>
  <path d="M1120 623 H1200" class="line"/>
  <path d="M1015 577 V404 H1000 V328" class="dash"/>
  <path d="M1295 577 V430 H1120 V328" class="dash"/>
  <text x="1055" y="397" class="small">启动时加载</text>
  <text x="1205" y="423" class="small">启动时加载</text>
</svg>
